/* ============ HALAMAN PESAN PELANGGAN (tampilan HP, ramah untuk pembeli sepuh) ============
 * Tulisan besar, tombol besar, kontras tinggi. Satu warna untuk satu arti:
 * biru = pilih / cari, hijau = sudah masuk pesanan / kirim, kuning = tulis daftar, merah = hapus.
 */
:root {
  color-scheme: light;
  --pri: #1d4e89;
  --pri2: #2c6bb5;
  --ok: #17803d;
  --ok-bg: #e9f7ee;
  --bad: #c62828;
  --warn: #b85c00;
  --warn-bg: #fff3e0;
  --ink: #16202c;
  --muted: #56606e;
  --line: #d9e0ea;
  --soft: #e8f0fb;
  --bg: #eef2f7;
  --kuning: #f2b705;
  --kuning-bg: #fff9e3;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family:
    system-ui,
    -apple-system,
    'Segoe UI',
    Roboto,
    Arial,
    sans-serif;
  font-size: 18px;
  line-height: 1.4;
}
body.kunci {
  overflow: hidden;
}
button {
  font: inherit;
  cursor: pointer;
}
input,
textarea,
select {
  font: inherit;
  width: 100%;
  border: 2px solid #b9c4d3;
  border-radius: 12px;
  padding: 12px 14px;
  min-height: 56px;
  background: #fff;
  color: var(--ink);
}
input:focus,
textarea:focus {
  outline: none;
  border-color: var(--pri2);
  background: #fffdf0;
  box-shadow: 0 0 0 3px #2c6bb533;
}
input::placeholder,
textarea::placeholder {
  color: #8a94a3;
}
.loading,
.gagal {
  max-width: 520px;
  margin: 15vh auto;
  padding: 24px;
  text-align: center;
  font-size: 19px;
  color: var(--muted);
}
.gagal b {
  color: var(--ink);
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
}
/* ---- kepala halaman ---- */
.hd {
  background: var(--pri);
  color: #fff;
  padding: 14px 16px 12px;
}
.hd-nama {
  font-size: 23px;
  font-weight: 800;
  line-height: 1.2;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hd-logo {
  width: 42px;
  height: 42px;
  flex: none;
  border-radius: 9px;
  box-shadow: 0 0 0 2px #ffffff66;
}
.hd-sub {
  font-size: 14px;
  opacity: 0.88;
  margin-top: 2px;
}
.hd-cara {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin-top: 10px;
  font-size: 15px;
  line-height: 1.3;
}
.hd-cara > div {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.hd-cara span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--kuning);
  color: #3a2a00;
  font-weight: 800;
  font-size: 14px;
}
.seg {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.seg button {
  flex: 1;
  border: 2px solid #ffffff55;
  border-radius: 12px;
  padding: 8px 4px;
  background: #ffffff1f;
  color: #fff;
  line-height: 1.2;
  min-height: 58px;
}
.seg button b {
  display: block;
  font-size: 17px;
}
.seg button small {
  display: block;
  font-size: 13px;
  opacity: 0.9;
  margin-top: 2px;
}
.seg button.on {
  background: #fff;
  border-color: #fff;
  color: var(--pri);
}
.seg button.on b::before {
  content: '✔ ';
  color: var(--ok);
}
.cariwrap {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--pri);
  padding: 0 16px 10px;
  box-shadow: 0 3px 8px #0003;
}
.cari {
  position: relative;
  padding-top: 2px;
}
.cari .ic {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 19px;
  pointer-events: none;
}
.cari input {
  padding-left: 46px;
  padding-right: 54px;
  font-size: 19px;
  border: 0;
  min-height: 56px;
}
.cari input::-webkit-search-cancel-button {
  display: none;
}
.cari .x {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: #fde8e8;
  color: var(--bad);
  font-weight: 800;
  font-size: 18px;
}
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 24px 2px 0;
  scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent);
  mask-image: linear-gradient(90deg, #000 85%, transparent);
}
.chips::-webkit-scrollbar {
  display: none;
}
.chips button {
  flex: none;
  border: 0;
  border-radius: 22px;
  padding: 9px 15px;
  background: #ffffff2b;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  white-space: nowrap;
}
.chips button.on {
  background: #fff;
  color: var(--pri);
}
/* ---- isi ---- */
.list {
  padding: 10px 12px 130px;
}
.judul {
  font-size: 17px;
  color: var(--ink);
  margin: 18px 4px 8px;
  font-weight: 800;
}
/* kotak tulis daftar: paling atas dan paling mencolok */
.tulis {
  background: var(--kuning-bg);
  border: 3px solid var(--kuning);
  border-radius: 16px;
  padding: 14px;
  margin-top: 4px;
}
.tulis h2 {
  font-size: 21px;
  margin: 0 0 4px;
}
.tulis > p {
  margin: 0 0 10px;
  font-size: 16px;
  color: #4a4130;
}
.tulis textarea {
  min-height: 150px;
  font-size: 19px;
  line-height: 1.5;
  border-color: #c9a227;
}
.ringkas {
  margin: 14px 2px 8px;
  font-size: 16px;
}
.t-oranye {
  color: var(--warn);
  font-weight: 800;
}
.t-merah {
  color: var(--bad);
  font-weight: 800;
}
.it {
  background: #fff;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: 0 1px 3px #0002;
}
.it-nm b {
  display: block;
  font-size: 18px;
  line-height: 1.3;
}
.it-nm small {
  display: block;
  color: var(--muted);
  font-size: 15px;
  margin-top: 2px;
}
.it-u {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.add {
  flex: 1 1 140px;
  border: 0;
  border-radius: 12px;
  background: var(--pri);
  color: #fff;
  padding: 8px 10px;
  min-height: 60px;
  text-align: center;
  line-height: 1.2;
}
.add .hrg {
  display: block;
  font-size: 19px;
  font-weight: 800;
}
.add .sat {
  display: block;
  font-size: 15px;
  font-weight: 600;
  opacity: 0.95;
}
.step {
  flex: 1 1 140px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  border: 3px solid var(--ok);
  border-radius: 12px;
  padding: 3px;
  min-height: 60px;
  background: var(--ok-bg);
}
.step > button:not(.sq) {
  flex: none;
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 10px;
  background: var(--ok);
  color: #fff;
  font-size: 26px;
  font-weight: 800;
  line-height: 1;
}
.step .sq {
  flex: 1;
  min-width: 0;
  text-align: center;
  line-height: 1.15;
  background: none;
  border: 0;
  color: var(--ink);
  padding: 0 2px;
}
.step .sq b {
  display: block;
  font-size: 18px;
}
.step .sq small {
  display: block;
  font-size: 13px;
  color: var(--muted);
}
.step.kecil {
  flex: 0 1 220px;
  min-height: 52px;
  border-width: 2px;
}
.step.kecil > button:not(.sq) {
  width: 42px;
  height: 42px;
  font-size: 22px;
}
.free {
  background: #fff;
  border: 2px dashed #a9b6c8;
  border-radius: 14px;
  padding: 12px;
  margin: 12px 0;
  color: var(--muted);
  font-size: 16px;
}
.free button {
  display: block;
  width: 100%;
  margin-top: 8px;
  border: 0;
  border-radius: 12px;
  background: var(--soft);
  color: var(--pri);
  font-weight: 800;
  padding: 14px;
  font-size: 17px;
}
.more {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 12px;
  background: var(--soft);
  color: var(--pri);
  font-weight: 700;
  padding: 16px;
  margin: 6px 0 12px;
  font-size: 17px;
}
.kosong {
  text-align: center;
  color: var(--muted);
  padding: 28px 10px;
}
.katgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
.katgrid button {
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 12px;
  padding: 10px;
  min-height: 58px;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.2;
}
.katgrid button span {
  font-size: 22px;
}
/* ---- hasil tulis daftar ---- */
.cocok {
  background: #fff;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px;
  border: 2px solid var(--line);
  border-left: 8px solid var(--ok);
}
.cocok.ragu {
  border-left-color: var(--warn);
  background: #fffaf3;
}
.cocok.tidak {
  border-left-color: var(--bad);
  background: #fff7f7;
}
.cocok .asli {
  font-size: 15px;
  color: var(--muted);
}
.cocok .asli b {
  color: var(--ink);
}
.cocok .pilih {
  font-weight: 800;
  font-size: 18px;
  margin: 4px 0;
}
.cocok.pas .pilih {
  color: var(--ok);
}
.cocok.ragu .pilih {
  color: var(--warn);
}
.cocok.tidak .pilih {
  color: var(--bad);
}
.saran {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 6px;
}
.cq {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-top: 8px;
}
.cq-h {
  font-weight: 800;
  font-size: 18px;
  white-space: nowrap;
}
.ganti {
  margin-top: 8px;
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 22px;
  padding: 8px 14px;
  font-size: 15px;
  color: var(--pri);
  font-weight: 700;
}
.units,
.alt {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.units button,
.alt button {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 22px;
  padding: 8px 14px;
  font-size: 15px;
  color: var(--ink);
  text-align: left;
}
.units button.on,
.alt button.on {
  border-color: var(--ok);
  background: var(--ok-bg);
  color: var(--ok);
  font-weight: 800;
}
.buang {
  margin-top: 10px;
  border: 0;
  background: none;
  color: var(--bad);
  font-size: 15px;
  font-weight: 700;
  padding: 6px 0;
}
/* ---- bar bawah ---- */
.bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(#eef2f700, #eef2f7 30%);
}
.bar button {
  display: flex;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border: 0;
  border-radius: 16px;
  padding: 14px 18px;
  min-height: 64px;
  background: var(--ok);
  color: #fff;
  font-size: 18px;
  box-shadow: 0 4px 14px #17803d55;
}
.bar button b {
  white-space: nowrap;
}
.bar button:disabled {
  background: #8c97a6;
  box-shadow: none;
}
.bar button:disabled b {
  display: none;
}
.bar button span {
  text-align: left;
  line-height: 1.2;
}
.bar button span small {
  display: block;
  font-size: 14px;
  opacity: 0.95;
}
/* ---- lembar pesanan ---- */
.sheet {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 40;
  background: var(--bg);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.sh-hd {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--pri);
  color: #fff;
  padding: 12px 14px;
}
.sh-hd button {
  border: 0;
  background: #ffffff2b;
  color: #fff;
  border-radius: 10px;
  padding: 10px 14px;
  font-weight: 700;
  font-size: 17px;
}
.sh-hd b {
  font-size: 20px;
  flex: 1;
}
.card {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  margin: 12px;
  box-shadow: 0 1px 3px #0002;
}
.card h2 {
  font-size: 19px;
  margin: 0 0 8px;
}
.li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.li:last-of-type {
  border-bottom: 0;
}
.li .nm {
  flex: 1;
  min-width: 0;
}
.li .nm b {
  display: block;
  font-size: 16px;
  line-height: 1.25;
}
.li .nm small {
  color: var(--muted);
  font-size: 14px;
}
.li .step {
  flex: none;
  width: 158px;
  min-height: 56px;
}
.li .step > button:not(.sq) {
  width: 42px;
  height: 42px;
  font-size: 22px;
}
.tot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  padding-top: 10px;
  border-top: 2px solid var(--line);
  margin-top: 4px;
}
.tot small {
  display: block;
  font-size: 13px;
  color: var(--muted);
}
.tot b {
  font-size: 24px;
  white-space: nowrap;
}
.note {
  font-size: 15px;
  color: var(--muted);
  margin: 8px 0 0;
}
.besar {
  font-size: 18px;
  margin: 4px 0 4px;
}
label {
  display: block;
  font-size: 16px;
  color: var(--ink);
  font-weight: 700;
  margin: 14px 0 6px;
}
.wajib {
  color: var(--bad);
  font-weight: 600;
  font-size: 14px;
}
.seg2 {
  display: flex;
  gap: 8px;
}
.seg2 button {
  flex: 1;
  border: 2px solid #b9c4d3;
  background: #fff;
  border-radius: 12px;
  padding: 12px 8px;
  min-height: 56px;
  font-weight: 700;
  color: var(--ink);
}
.seg2 button.on {
  border-color: var(--pri);
  background: var(--soft);
  color: var(--pri);
}
.btn {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  min-height: 58px;
  font-size: 18px;
  font-weight: 800;
  margin-top: 10px;
  background: var(--soft);
  color: var(--pri);
  text-align: center;
  text-decoration: none;
}
.btn.biru {
  background: var(--pri);
  color: #fff;
}
.btn.wa {
  background: var(--ok);
  color: #fff;
  font-size: 19px;
}
.btn.besar {
  min-height: 68px;
  font-size: 20px;
}
.btn.lite {
  background: #f1f3f6;
  color: #3b4554;
  font-size: 16px;
  padding: 12px;
  min-height: 50px;
}
.btn.merah {
  background: var(--bad);
  color: #fff;
}
.btn.hapus {
  background: none;
  color: var(--bad);
  font-size: 16px;
  min-height: 48px;
}
.kecil2 {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.kecil2 .btn {
  flex: 1 1 130px;
  margin-top: 0;
}
.done {
  background: var(--ok-bg);
  border: 3px solid var(--ok);
}
.intip {
  margin-top: 12px;
  font-size: 16px;
}
.intip summary {
  cursor: pointer;
  color: var(--pri);
  font-weight: 700;
  padding: 6px 0;
}
.intip pre {
  white-space: pre-wrap;
  word-break: break-word;
  background: #f6f8fa;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  font-family: inherit;
  font-size: 15px;
  margin: 6px 0 0;
}
.qrbox {
  text-align: center;
}
.qrbox img {
  width: 100%;
  max-width: 340px;
  image-rendering: pixelated;
}
/* ---- jendela kecil ---- */
.dlg-bg {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 70;
  background: #0008;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.dlg {
  background: #fff;
  border-radius: 18px;
  padding: 18px;
  width: 100%;
  max-width: 420px;
  max-height: 90vh;
  overflow: auto;
}
.dlg h3 {
  margin: 0 0 6px;
  font-size: 19px;
  line-height: 1.3;
}
.dlg-p {
  font-size: 18px;
  margin: 4px 0 10px;
}
.dlg-q {
  display: flex;
  gap: 8px;
  align-items: center;
}
.dlg-q button {
  flex: none;
  width: 64px;
  height: 64px;
  border: 0;
  border-radius: 14px;
  background: var(--ok);
  color: #fff;
  font-size: 30px;
  font-weight: 800;
}
.dlg-q input {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  min-height: 64px;
}
.dlg-b {
  display: flex;
  gap: 8px;
}
.dlg-b .btn {
  flex: 1;
}
.dlg textarea.salin {
  font-size: 15px;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 100px;
  transform: translateX(-50%);
  z-index: 80;
  background: #16202c;
  color: #fff;
  padding: 12px 18px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 17px;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  max-width: 92vw;
  text-align: center;
}
#toast.on {
  opacity: 1;
}
#toast.bad {
  background: var(--bad);
}
.foot {
  text-align: center;
  font-size: 14px;
  color: var(--muted);
  padding: 4px 12px 24px;
}
@media (min-width: 760px) {
  .hd {
    padding-top: 18px;
  }
}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {

    const nyambung = kataCari.some(

        w.length >= 2 && k.some(x => x.startsWith(w) || w.startsWith(x) || (w.length >= 4 && x.includes(w)))

   *  cocok = kemiripan kata saja (tanpa laris/prioritas), dipakai untuk menilai "yakin atau tidak" */

    const qs = tokens(query);
    if (!qs.length) return [];
    const wajib = qs.filter(q => !KATA_BEBAS.has(q) && !SATUAN.has(q) && !/^\d+$/.test(q));

    for (const e of idx) {
      if (bisaSingkat && (e.singkat.startsWith(qRapat) || e.singkatAngka.startsWith(qRapat))) {
        const persis = e.singkat === qRapat || e.singkatAngka === qRapat;
        hasil.push([
          (persis ? 30 : 18) + Math.min(6, Math.log2(1 + e.populer)) + skorPrioritas(e, []),
          e,
          persis ? 30 : 18
        ]);

      }
      let skor = 0,
        meleset = 0;
      for (const q of wajib) {
        const s = skorKata(e, q);
        if (s) skor += s;
        else meleset++;
      }
      if (wajib.length && (meleset > 1 || (meleset === 1 && wajib.length < 3))) continue;
      if (!wajib.length && !opsional.some(q => e.semua.includes(q))) continue;
      skor -= meleset * 6;
      for (const q of opsional) if (e.semua.includes(q)) skor += 6;
      if (e.teks.startsWith(' ' + qn)) skor += 8;
      const cocok = skor; // kemiripan kata saja, sebelum ditambah laris / prioritas
      if (wajib[0] && e.namaTok[0] && (e.namaTok[0] === wajib[0] || e.namaTok[0].startsWith(wajib[0])))

      skor += Math.min(6, Math.log2(1 + e.populer));
      skor += skorPrioritas(e, wajib);
      skor -= e.namaTok.length * 0.15;
      hasil.push([skor, e, cocok]);
    }
    hasil.sort((a, b) => b[0] - a[0] || b[1].populer - a[1].populer);
    return hasil.slice(0, batas).map(h => ({ item: h[1].item, skor: h[0], cocok: h[2] }));
  }
  /** daftar barang yang cocok, paling cocok di atas */
  function cari(idx, query, batas = 40) {
    return cariSkor(idx, query, batas).map(h => h.item);
  }

  return { indeks, cari, cariSkor, norm, tokens };
})();

  const EMOJI = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu;

  const namaSatuan = u => KATA[String(u || '').toUpperCase()] || String(u || '').toLowerCase();
  const kodeSatuan = w => {
    const k = String(w || '')

  function angka(s) {

      qty = angka(m[2]);
      kata = m[3];

      teks = m[1];
      qty = angka(m[2]);

      teks,
      qty: qty > 0 ? Math.round(qty * 1000) / 1000 : 1,

  function baca(raw, opt = {}) {
    const o = { nama: '', hp: '', harga: '', ambil: '', catatan: [], baris: [] };

      if ((m = line.match(/^nama(?:\s+(?:pemesan|pembeli|warung|toko|lengkap))?\s*[:=]\s*(.*)$/i))) {

      nama: o.nama,
      hp: o.hp,
      harga: o.harga,

      .toLowerCase()
      .replace(/(\d),(\d)/g, '$1.$2')
      .replace(/(\d)([a-z])/g, '$1 $2')
      .replace(/[^a-z0-9./]+/g, ' ')
      .trim()
      .split(' ');
  function ukuran(nama, qty, unit) {
    const k = UKUR[String(unit || '').toUpperCase()];
    if (!k || !(qty > 0)) return 0;
    const t = tokUkur(nama);
    const ada = b => t.some((x, i) => x === b && k.includes(t[i + 1]));
    if ([String(Math.round(qty * 1000) / 1000), ...(PECAHAN[qty] || [])].some(ada)) return 2;
    return qty >= 1 && ada('1') ? 1 : 0;
  }

  /** pembantu: apakah angka di belakang ("surya 16") bagian dari nama barang? */
  function pembantuAngka(idx, namaOf) {
    return (teks, n) => {
      const r = CariProduk.cari(idx, teks + ' ' + n, 1);
      return !!r[0] && CariProduk.tokens(namaOf(r[0])).includes(CariProduk.norm(n));
    };
  }

  return { baca, namaSatuan, kodeSatuan, fmtQty, angka, ukuran, pembantuAngka, SATUAN };
})();

      const names = p.u.map(u => u[0]);

        if (names.includes(unit)) return unit;
        for (const a of UNIT_SAMA[unit] || []) if (names.includes(a)) return a;

      // yakin hanya kalau katanya memang mirip (bukan sekadar barang laris)

        ragu: !!p && r.length > 1 && r[0].skor - r[1].skor < 3,

      };
      if (p && r[0].uk === 2) {
        // "telur 1/2 kg" -> TELUR AYAM 1/2 KG sebanyak 1
        c.qty = 1;
        c.unitSel = p.u[0][0];
      } else if (p && b.unit && !persis && !punyaUnit(p, b.unit)) {

        c.ragu = true;

      const ketemu = cocokan.filter(c => c.pilih).length;
      box.innerHTML =
        `<div class="ringkas">Ketemu <b>${ketemu}</b> dari <b>${cocokan.length}</b> barang.${ketemu < cocokan.length || cocokan.some(c => c.ragu) ? ' Cek yang berwarna <span class="t-oranye">oranye</span> atau <span class="t-merah">merah</span>.' : ''}</div>` +
        cocokan
          .map((c, k) => {
            const p = byId.get(c.pilih);
            const h = p && TIERS.length ? hargaUnit(p, c.unitSel) : 0;
            const ditulis = [fq(c.qty), c.kata, c.teks].filter(Boolean).join(' ');
            return `<div class="cocok ${p ? (c.ragu ? 'ragu' : 'pas') : 'tidak'}" data-k="${k}">
            <div class="asli">Anda tulis: <b>${esc(ditulis)}</b></div>
            <div class="pilih">${p ? (c.ragu ? '❓ ' : '✔ ') + esc(p.n) : '❔ Belum ketemu di daftar'}</div>
            ${c.satuanHilang ? `<div class="saran">Satuan “${esc(c.satuanHilang)}” tidak ada untuk barang ini, jadi dihitung per ${esc(sat(c.unitSel))}. Ubah jumlahnya kalau perlu.</div>` : c.ragu ? '<div class="saran">Mungkin maksudnya yang lain? Ketuk yang benar di bawah.</div>' : !p ? `<div class="saran">${c.hasil.length ? 'Ketuk barang yang benar di bawah, atau biarkan dipesan apa adanya (nanti dicarikan toko).' : 'Tetap dipesan apa adanya, nanti dicarikan toko.'}</div>` : ''}
            <div class="cq"><div class="step kecil"><button type="button" data-cm aria-label="kurangi">−</button><button type="button" class="sq" data-cs><b>${fq(c.qty)}${p ? ' ' + esc(sat(c.unitSel)) : c.unit ? ' ' + esc(sat(c.unit)) : ''}</b></button><button type="button" data-cp aria-label="tambah">+</button></div>${h ? `<span class="cq-h">Rp ${rp(h * c.qty)}</span>` : ''}</div>
            ${p && p.u.length > 1 ? `<div class="units">${p.u.map(u => `<button type="button" data-cu="${esc(u[0])}" class="${u[0] === c.unitSel ? 'on' : ''}">${esc(sat(u[0]))}${TIERS.length ? ` · Rp ${rp(hargaUnit(p, u[0]))}` : ''}</button>`).join('')}</div>` : ''}
            ${p && !c.ragu && !c.buka && c.hasil.length > 1 ? '<button type="button" class="ganti" data-buka>🔄 Bukan ini? Ganti barang</button>' : ''}
            ${c.hasil.length && (c.ragu || !p || c.buka) ? `<div class="alt">${c.hasil.map(x => `<button type="button" data-alt="${esc(x.i)}" class="${x.i === c.pilih ? 'on' : ''}">${esc(x.n)}</button>`).join('')}<button type="button" data-alt="" class="${c.pilih ? '' : 'on'}">✍️ apa adanya</button></div>` : ''}
            <button type="button" class="buang" data-buang>🗑️ Hapus baris ini</button></div>`;
          })
          .join('') +
        `<button class="btn wa" id="tlAdd" type="button">➕ Masukkan ${cocokan.length} barang ke pesanan</button>`;
      $$('[data-k]', box).forEach(row => {
        const k = +row.dataset.k;
        const c = cocokan[k];
        $$('[data-alt]', row).forEach(
          b =>
            (b.onclick = () => {
              c.pilih = b.dataset.alt;
              c.ragu = false;
              const p = byId.get(c.pilih);
              c.unitSel = p ? pilihUnit(p, c.unit) : '';
              drawCocok();
            })
        );
        $('[data-buka]', row) &&
          ($('[data-buka]', row).onclick = () => {
            c.buka = true;
            drawCocok();
          });
        $$('[data-cu]', row).forEach(
          b =>
            (b.onclick = () => {
              c.unitSel = b.dataset.cu;
              drawCocok();
            })
        );
        $('[data-cm]', row).onclick = () => {
          c.qty = c.qty > 1 ? Math.round((c.qty - 1) * 100) / 100 : c.qty;
          drawCocok();
        };
        $('[data-cp]', row).onclick = () => {
          c.qty = Math.round((c.qty + 1) * 100) / 100;
          drawCocok();
        };
        $('[data-cs]', row).onclick = () => {
          const p = byId.get(c.pilih);
          dialogJumlah(p ? p.n : c.teks, p ? c.unitSel : c.unit, c.qty, n => {
            if (n > 0) c.qty = n;
            else cocokan.splice(k, 1);
            drawCocok();
          });
        };
        $('[data-buang]', row).onclick = () => {
          cocokan.splice(k, 1);
          drawCocok();
        };
      });
      $('#tlAdd').onclick = () => {
        let n = 0;
        for (const c of cocokan) {
          const p = byId.get(c.pilih);
          if (p) ubahQty(p.i, c.unitSel, c.qty, p.n);
          else {
            st.items.push({ i: '', u: c.unit || '', q: c.qty, n: c.teks });
            simpan();
          }
          n++;
        }
        cocokan = [];
        view.tulis = '';
        drawBar();
        toast(`✔ ${n} barang masuk ke pesanan`);
        bukaSheet();
      };
    }

    /* ---------- bar bawah ---------- */
    function drawBar() {
      const n = st.items.length;
      const t = total();
      $('#barBtn').disabled = !n;
      $('#barTxt').innerHTML = n
        ? `🛒 ${n} barang${TIERS.length && t ? `<small>± Rp ${rp(t)} · harga ${esc(tierNama())}</small>` : ''}`
        : 'Belum ada barang dipilih';
    }
    $('#barBtn').onclick = () => bukaSheet();

    /* ---------- lembar pesanan & kirim ---------- */
    function b64url(s) {
      const bytes = new TextEncoder().encode(s);
      let bin = '';
      bytes.forEach(b => (bin += String.fromCharCode(b)));
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    /** data pesanan ringkas untuk link kasir: nama barang tidak ikut (kasir mencocokkan lewat kode barang) */
    function payload() {
      return b64url(
        JSON.stringify([
          2,
          st.nama,
          st.hp,
          st.cat,
          st.ambil === 'antar' ? 1 : 0,
          st.tier,
          st.items.map(x => (x.i ? [x.i, x.u, x.q] : ['', x.u || '', x.q, x.n]))
        ])
      );
    }
    function linkKasir() {
      const base = K.kasir || (location.protocol.startsWith('http') ? new URL('./', location.href).href : '');
      return base ? base.replace(/(index\.html)?$/, '') + '#pesan=' + payload() : '';
    }
    /** Pesan WhatsApp: rapi, satu barang satu baris, tanpa tanda bintang / garis / nomor urut */
    function teksWA() {
      const L = ['PESANAN ' + String(toko.nama || '').toUpperCase(), 'Nama: ' + st.nama];
      if (st.hp) L.push('No. HP: ' + st.hp);
      if (TIERS.length > 1) L.push('Harga: ' + tierNama());
      L.push(st.ambil === 'antar' ? 'Diantar' : 'Diambil ke toko');
      if (st.cat) L.push('Catatan: ' + st.cat.replace(/\s*\n\s*/g, ', '));
      L.push('');
      st.items.forEach(x =>
        L.push(`${fq(x.q)}${x.u ? ' ' + sat(x.u) : ''} - ${x.n}${x.i ? '' : ' (belum ada di daftar)'}`)
      );
      if (TIERS.length && total()) L.push('', 'Perkiraan total: Rp ' + rp(total()));
      const lk = linkKasir();
      if (lk) L.push('', 'Buka di kasir:', lk);
      return L.join('\n');
    }
    function bukaSheet() {
      const sh = $('#sheet');
      if (sh.hidden) {
        sh.hidden = false;
        document.body.classList.add('kunci');
        history.pushState({ sheet: 1 }, '');
      }
      drawSheet();
      sh.scrollTop = 0;
    }
    function tutupSheet(viaBack) {
      const sh = $('#sheet');
      if (sh.hidden) return;
      sh.hidden = true;
      document.body.classList.remove('kunci');
      if (!viaBack && history.state && history.state.sheet) history.back();
      drawList();
      drawBar();
    }
    addEventListener('popstate', () => tutupSheet(true));
    function drawSheet(terkirim) {
      const t = total();
      const teks = st.items.length && st.nama ? teksWA() : '';
      $('#sheet').innerHTML =
        `<div class="sh-hd"><button id="shBack" type="button">← Kembali</button><b>Pesanan Anda</b></div><div class="wrap">
       <div class="card"><h2>🛒 Barang yang dipesan (${st.items.length})</h2>${
         st.items
           .map(x => {
             const h = x.i && TIERS.length ? hargaUnit(byId.get(x.i), x.u) : 0;
             return `<div class="li" data-li="${st.items.indexOf(x)}"><div class="nm"><b>${esc(x.n)}</b><small>${x.i ? '' : 'belum ada di daftar, nanti dicarikan · '}${h ? `Rp ${rp(h)} / ${esc(sat(x.u))}` : esc(sat(x.u))}</small></div>
             <div class="step"><button data-dec type="button" aria-label="kurangi">−</button><button class="sq" data-set type="button"><b>${fq(x.q)}</b><small>${esc(sat(x.u))}</small></button><button data-inc type="button" aria-label="tambah">+</button></div></div>`;
           })
           .join('') || '<div class="kosong">Belum ada barang.</div>'
       }
       ${TIERS.length && t ? `<div class="tot"><span>Perkiraan total<small>harga ${esc(tierNama())}, total akhir dihitung toko</small></span><b>Rp ${rp(t)}</b></div>` : ''}
       <button class="btn lite" id="shAdd" type="button">➕ Tambah barang lain</button></div>
       <div class="card"><h2>👤 Data pemesan</h2>
        <label for="fNama">Nama Anda / nama warung <span class="wajib">(wajib)</span></label><input id="fNama" value="${esc(st.nama)}" placeholder="contoh: Toko Emih" autocomplete="name">
        <label for="fHp">No. HP (boleh kosong)</label><input id="fHp" value="${esc(st.hp)}" inputmode="tel" autocomplete="tel">
        <label>Barangnya mau</label><div class="seg2"><button type="button" data-ambil="ambil" class="${st.ambil !== 'antar' ? 'on' : ''}">🏪 Diambil ke toko</button><button type="button" data-ambil="antar" class="${st.ambil === 'antar' ? 'on' : ''}">🛵 Diantar</button></div>
        <label for="fCat">Catatan (alamat antar, jam ambil, dll)</label><textarea id="fCat" rows="2">${esc(st.cat)}</textarea></div>
       <div class="card ${terkirim ? 'done' : ''}" id="kirimBox">${
         terkirim
           ? `<h2>✔ WhatsApp sudah dibuka</h2><p class="besar">Sudah menekan tombol <b>Kirim ➤</b> di WhatsApp?</p>
              <button class="btn wa" id="kSudah" type="button">✔ Sudah terkirim</button><button class="btn" id="kWa2" type="button">📲 Buka WhatsApp lagi</button><button class="btn lite" id="kCopy" type="button">📋 Salin pesan (kirim manual)</button>`
           : `${toko.wa ? '<button class="btn wa besar" id="kWa" type="button">📲 Kirim pesanan lewat WhatsApp</button><p class="note">WhatsApp terbuka dengan pesan yang sudah jadi. Tinggal tekan tombol <b>Kirim ➤</b>.</p>' : ''}
              ${teks ? `<details class="intip"><summary>👁️ Lihat isi pesan</summary><pre>${esc(teks)}</pre></details>` : ''}
              <div class="kecil2"><button class="btn lite" id="kCopy" type="button">📋 Salin pesan</button><button class="btn lite" id="kQr" type="button">🔳 QR untuk kasir</button><button class="btn lite" id="kClr" type="button">🗑️ Kosongkan</button></div><div class="qrbox" id="qrBox"></div>`
       }</div><p class="foot">Daftar pesanan tersimpan di HP ini sampai dikirim.</p></div>`;
      $('#shBack').onclick = () => tutupSheet();
      $('#shAdd').onclick = () => tutupSheet();
      $$('[data-li]').forEach(row => {
        const x = st.items[+row.dataset.li];
        row.onclick = e => {
          const b = e.target.closest('button');
          if (!b) return;
          const selesai = () => {
            if (x.q <= 0) st.items = st.items.filter(y => y !== x);
            simpan();
            drawSheet();
            drawBar();
          };
          if (b.hasAttribute('data-inc')) x.q = Math.round((x.q + 1) * 100) / 100;
          else if (b.hasAttribute('data-dec')) x.q = Math.round((x.q - 1) * 100) / 100;
          else if (b.hasAttribute('data-set'))
            return dialogJumlah(x.n, x.u, x.q, n => {
              x.q = n;
              selesai();
            });
          selesai();
        };
      });
      const baca = () => {
        st.nama = $('#fNama').value.trim();
        st.hp = $('#fHp').value.trim();
        st.cat = $('#fCat').value.trim();
        simpan();
      };
      ['#fNama', '#fHp', '#fCat'].forEach(s => $(s).addEventListener('input', baca));
      ['#fNama', '#fHp', '#fCat'].forEach(s =>
        $(s).addEventListener('change', () => {
          const d = $('.intip pre');
          if (d && st.items.length && st.nama) d.textContent = teksWA();
        })
      );
      $$('[data-ambil]').forEach(
        b =>
          (b.onclick = () => {
            st.ambil = b.dataset.ambil;
            simpan();
            $$('[data-ambil]').forEach(x => x.classList.toggle('on', x === b));
            const d = $('.intip pre');
            if (d && st.items.length && st.nama) d.textContent = teksWA();
          })
      );
      const siap = () => {
        baca();
        if (!st.items.length) {
          toast('Daftar pesanan masih kosong', true);
          return false;
        }
        if (!st.nama) {
          toast('Isi nama dulu', true);
          $('#fNama').focus();
          $('#fNama').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return false;
        }
        return true;
      };
      const salin = async () => {
        if (!siap()) return;
        try {
          await navigator.clipboard.writeText(teksWA());
          toast('Pesan disalin ✔ Tempel di WhatsApp');
        } catch (e) {
          const g = dialog(
            `<h3>Salin pesan ini</h3><textarea class="salin" rows="10" readonly>${esc(teksWA())}</textarea><div class="dlg-b"><button class="btn lite" type="button" data-batal>Tutup</button></div>`
          );
          $('textarea', g.el).select();
          $('[data-batal]', g.el).onclick = g.tutup;
        }
      };
      const kirimWA = () => {
        if (!siap()) return;
        const url = 'https://wa.me/' + toko.wa + '?text=' + encodeURIComponent(teksWA());
        const w = window.open(url, '_blank');
        if (!w) location.href = url;
        drawSheet(true);
      };
      $('#kCopy') && ($('#kCopy').onclick = salin);
      $('#kWa') && ($('#kWa').onclick = kirimWA);
      $('#kWa2') && ($('#kWa2').onclick = kirimWA);
      $('#kQr') &&
        ($('#kQr').onclick = () => {
          if (!siap()) return;
          const box = $('#qrBox');
          try {
            const qr = qrcode(0, 'L');
            qr.addData(linkKasir() || teksWA());
            qr.make();
            box.innerHTML = `<p class="note">Kalau sedang di toko, tunjukkan layar ini ke kasir untuk discan:</p><img alt="QR pesanan" src="${qr.createDataURL(4, 4)}">`;
            box.scrollIntoView({ behavior: 'smooth' });
          } catch (e) {
            box.innerHTML =
              '<p class="note">Pesanan terlalu panjang untuk QR. Kirim lewat WhatsApp saja.</p>';
          }
        });
      $('#kClr') &&
        ($('#kClr').onclick = async () => {
          if (st.items.length && !(await tanya('Kosongkan semua barang di daftar pesanan?', 'Ya, kosongkan')))
            return;
          st.items = [];
          simpan();
          drawSheet();
          drawBar();
        });
      $('#kSudah') &&
        ($('#kSudah').onclick = () => {
          st.items = [];
          st.cat = '';
          simpan();
          tutupSheet();
          toast('Terima kasih, pesanan diproses 🙏');
        });
    }

    drawTier();
    drawChips();
    drawList();
    drawBar();
  }

  muatKatalog().then(K => (K && Array.isArray(K.p) && K.p.length ? mulai(K) : gagal(K)));
})();

</script>
</body>
</html>
